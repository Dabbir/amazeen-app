# Local development only. Used explicitly with `--config wrangler.local.toml` (see package.json).
# It is deliberately NOT named wrangler.toml: Cloudflare Pages treats that file as the source of
# truth for bindings and would ignore the D1 binding you set in the dashboard.
name = "amazeen-local"
compatibility_date = "2026-11-01"
[[d1_databases]]
binding = "DB"
database_name = "amazeen-sync"
database_id = "local-amazeen"
migrations_dir = "migrations"
